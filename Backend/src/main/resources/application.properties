spring.application.name=ms-productos
server.port=${SERVER_PORT:8181}

# Base de datos (valores reales por variables de entorno, nunca en el repo)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_cloud?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Seguridad
jwt.secret=${JWT_SECRET}
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/a08a76b3-9088-491e-a89d-b08ee3f42e46/v2.0

# RabbitMQ (cluster de 2 nodos)
spring.rabbitmq.addresses=${RABBIT_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBIT_USER:admin}
spring.rabbitmq.password=${RABBIT_PASS:admin123}

# Nombres de exchanges y routing keys con los que publica este servicio
rabbit.exchanges.direct=rednorte.direct
rabbit.exchanges.topic=rednorte.topic
rabbit.routing.notificaciones=notificacion.enviar
rabbit.routing.tickets=ticket.generar
rabbit.routing.documentos=documento.generar