spring:
  application:
    name: ms-notificaciones
  rabbitmq:
    addresses: ${RABBIT_ADDRESSES:localhost:5672}
    username: ${RABBIT_USER:admin}
    password: ${RABBIT_PASS:admin123}
    listener:
      simple:
        acknowledge-mode: manual        # ACK explicito en cada consumidor
        prefetch: 10
        default-requeue-rejected: false # un rechazo va a la DLQ, no vuelve a la cola

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Nombres de exchanges, colas y routing keys: UNICO lugar donde se definen
rabbit:
  exchanges:
    direct: rednorte.direct
    topic: rednorte.topic
    dlx: rednorte.dlx
  queues:
    notificaciones: q.notificaciones
    tickets: q.tickets
    documentos: q.documentos
    dlq-suffix: .dlq
  routing:
    notificaciones: notificacion.enviar
    tickets: ticket.generar
    documentos: documento.*